---
name: Claude Code Review
on:
  pull_request:
    types:
    - opened
    - ready_for_review
    - synchronize
    - reopened
permissions: {}
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.event.action
    }}
  cancel-in-progress: true
jobs:
  freshness:
    name: Current commit reviewed
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      pull-requests: read
      contents: read
    steps:
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      env:
        EXPECTED_REVIEW_REF: Amperative/review-workflows/.github/workflows/claude-review.yml@45a5be608b0e41359196ea1fb98cea838b7a29e3
      with:
        script: |
          // Runs from the protected organization-required wrapper, never PR checkout code.
          // Reads GitHub evidence only; it never requests provider credentials.
          const {owner, repo} = context.repo;
          const head = context.payload.pull_request.head.sha;
          const number = context.payload.pull_request.number;
          const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: number});
          if (current.head.sha !== head) { core.setFailed('This run belongs to an older PR commit; request review of the current revision.'); return; }
          if (current.draft) {
            core.setFailed('Draft: Claude review has not been requested. Finish changes and mark ready when you want review.');
            return;
          }
          const sourcePath = process.env.EXPECTED_REVIEW_REF;
          if (!sourcePath || !/@[0-9a-f]{40}$/.test(sourcePath)) throw new Error('Missing exact trusted reviewer reference');
          const sourceSha = sourcePath.split('@').pop();
          const baseFiles = new Map(), headFiles = new Map(), completedJobs = new Map();
          const deadline = Date.now() + (context.payload.action === 'ready_for_review' ? 600000 : 0);
          while (true) {
            let changedCaller = false, unchangedCaller = false, reviews;
            // Paginate this exact head; immutable file/job evidence is cached across polls.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {owner, repo, head_sha: head, event: 'pull_request', per_page: 100});
            for (const run of runs) {
              if (run.head_sha !== head || !run.pull_requests.some(pr => pr.number === number)) continue;
              if (!(run.referenced_workflows || []).some(ref => ref.path === sourcePath && ref.sha === sourceSha)) continue;
              // A changed caller cannot invent success beside a skipped reusable job.
              const path = (run.path || '').split('@')[0];
              if (!/^\.github\/workflows\/[^/]+\.ya?ml$/.test(path)) continue;
              if (!baseFiles.has(path)) {
                try {
                  const {data: file} = await github.rest.repos.getContent({owner, repo, path, ref: current.base.sha});
                  baseFiles.set(path, file.type === 'file' ? file.sha : null);
                } catch (error) { if (error.status !== 404) throw error; baseFiles.set(path, null); }
              }
              if (!baseFiles.get(path)) { changedCaller = true; continue; }
              if (!headFiles.has(path)) {
                const {data: file} = await github.rest.repos.getContent({owner, repo, path, ref: head});
                headFiles.set(path, file.type === 'file' ? file.sha : null);
              }
              if (headFiles.get(path) !== baseFiles.get(path)) { changedCaller = true; continue; }
              unchangedCaller = true;
              let jobs = completedJobs.get(run.id);
              if (!jobs) {
                jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner, repo, run_id: run.id, per_page: 100});
                if (run.status === 'completed') completedJobs.set(run.id, jobs);
              }
              const model = jobs.find(job => job.name.endsWith('/ Claude findings') && job.conclusion === 'success');
              if (!model) continue;
              reviews ||= await github.paginate(github.rest.pulls.listReviews, {owner, repo, pull_number: number, per_page: 100});
              if (!reviews.some(review => review.commit_id === head && review.user?.login === 'github-actions[bot]' && review.state === 'COMMENTED' && review.body?.trim() && Date.parse(review.submitted_at) >= Date.parse(model.started_at) && Date.parse(review.submitted_at) <= Date.parse(model.completed_at))) continue;
              core.info(`Trusted Claude review completed for current PR commit ${head}; run ${run.id}. Human review still decides whether findings are resolved.`);
              return;
            }
            if (changedCaller && !unchangedCaller && Date.now() >= deadline) {
              core.setFailed('Review caller changed in this PR. Its own workflow cannot certify merge evidence; use the audited owner-approved caller-upgrade procedure after independent review.');
              return;
            }
            if (Date.now() >= deadline) break;
            await new Promise(resolve => setTimeout(resolve, 30000));
          }
          core.setFailed('Current commit has no completed hardened Claude review. Return to draft, finish changes, then mark ready. If the review has just completed, rerun this lightweight check; it does not invoke Claude.');
