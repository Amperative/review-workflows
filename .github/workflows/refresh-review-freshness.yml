---
name: Refresh Claude review freshness
'on':
  workflow_call:
    inputs:
      freshness-workflow-id:
        type: number
        required: true
      expected-review-ref:
        type: string
        required: true
permissions:
  actions: write
  pull-requests: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      env:
        FRESHNESS_WORKFLOW_ID: "${{ inputs.freshness-workflow-id }}"
        EXPECTED_REVIEW_REF: "${{ inputs.expected-review-ref }}"
      with:
        script: |
          // workflow_run executes the protected default-branch caller. Never check out PR code.
          if (context.eventName !== 'workflow_run') throw new Error('Completion refresh requires workflow_run');
          const {owner, repo} = context.repo;
          const trigger = context.payload.workflow_run;
          if (trigger.event !== 'pull_request' || trigger.conclusion !== 'success' || trigger.head_repository?.full_name !== `${owner}/${repo}`) return;
          const workflowId = Number(process.env.FRESHNESS_WORKFLOW_ID);
          const expected = process.env.EXPECTED_REVIEW_REF;
          if (!Number.isSafeInteger(workflowId) || workflowId <= 0 || !/^Amperative\/(?:\.github|review-workflows)\/\.github\/workflows\/claude-review\.yml@[0-9a-f]{40}$/.test(expected || '')) throw new Error('Invalid protected completion configuration');
          const {data: completed} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: trigger.id});
          if (completed.event !== 'pull_request' || completed.conclusion !== 'success' || completed.head_sha !== trigger.head_sha || completed.head_repository?.full_name !== `${owner}/${repo}`) return;
          if (!(completed.referenced_workflows || []).some(ref => ref.path === expected && ref.sha === expected.split('@').pop())) return;
          const modelJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner, repo, run_id: completed.id, per_page: 100});
          if (!modelJobs.some(job => job.name.endsWith('/ Claude findings') && job.conclusion === 'success')) return;
          for (const pr of completed.pull_requests || []) {
            const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: pr.number});
            if (current.state !== 'open' || current.draft || current.head.sha !== completed.head_sha) continue;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {owner, repo, head_sha: completed.head_sha, event: 'pull_request', per_page: 100});
            const wrapper = runs.filter(run => run.workflow_id === workflowId && run.path === '.github/workflows/review-pull-requests.yml' && run.head_sha === completed.head_sha && run.id !== completed.id).sort((a,b) => b.id-a.id)[0];
            if (!wrapper) { core.warning('No required freshness run found for this head; check the protected workflow ID and branch CI configuration.'); continue; }
            if (wrapper.status !== 'completed' || wrapper.conclusion !== 'failure') continue;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner, repo, run_id: wrapper.id, per_page: 100});
            for (const job of jobs.filter(job => job.name === 'Current commit reviewed' && job.conclusion === 'failure')) {
              try {
                // Re-run only this read-only job, never the model or an entire workflow.
                await github.request('POST /repos/{owner}/{repo}/actions/jobs/{job_id}/rerun', {owner, repo, job_id: job.id});
                core.info(`Refreshed current-commit review check for PR #${pr.number}, job ${job.id}. No model was invoked.`);
              } catch (error) {
                if (error.status === 409) { core.info('Freshness is already being refreshed.'); continue; }
                core.setFailed(`Could not refresh the review check (HTTP ${error.status || 'unknown'}).`);
              }
            }
          }
